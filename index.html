<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intel Sustainability Summit Check-In</title>
    <!-- Add Font Awesome CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Hero section with Intel branding -->
    <header class="hero">
      <div class="hero-content">
        <img src="img/intel-logo.svg" alt="Intel Logo" class="intel-logo" />
        <!-- Two lines: a big uppercase title and a lighter subtitle -->
        <h1>
          <span class="title-main">Sustainability Summit</span>
          <span class="title-sub">Team Check-In</span>
        </h1>
        <p class="hero-text">
          <i class="fas fa-leaf"></i> Check-in system for sustainability event
          attendees
        </p>

        <p class="scroll-indicator">
          Check in below
          <span class="scroll-line" aria-hidden="true"></span>
        </p>
      </div>
    </header>

    <!-- Main check-in area -->
    <main class="checkin-section">
      <!-- Attendance tracking -->
      <div class="attendance-tracker">
        <div class="attendance-header">
          <i class="fas fa-users"></i>
          Attendance: <span id="attendeeCount">0</span>/50
        </div>
        <div class="progress-container">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>
      <div class="container">
        <!-- Feedback message -->
        <p id="greeting"></p>

        <!-- Check-in form -->
        <form class="check-in" id="checkInForm">
          <label for="attendeeName" class="form-label">Attendee Check-In</label>
          <div class="form-group">
            <div class="input-wrapper">
              <input
                type="text"
                id="attendeeName"
                name="attendeeName"
                placeholder="Enter name..."
                required
              />
              <select id="teamSelect" name="team" required>
                <option value="" disabled selected>Select Team...</option>
                <option value="water">Team Water Wise</option>
                <option value="zero">Team Net Zero</option>
                <option value="power">Team Renewables</option>
              </select>
            </div>
            <button type="submit" id="checkInBtn">
              <i class="fas fa-user-check"></i> Check In
            </button>
          </div>
        </form>

        <!-- Team stats -->
        <div class="team-stats">
          <h3>Team Attendance</h3>
          <div class="teams-grid">
            <div class="team-card water">
              <span class="team-name">🌊 Team Water Wise</span>
              <span class="team-count" id="waterCount">0</span>
            </div>
            <div class="team-card zero">
              <span class="team-name">🌿 Team Net Zero</span>
              <span class="team-count" id="zeroCount">0</span>
            </div>
            <div class="team-card power">
              <span class="team-name">⚡ Team Renewables</span>
              <span class="team-count" id="powerCount">0</span>
            </div>
          </div>
        </div>

        <section class="attendee-section" aria-labelledby="attendeeListHeading">
          <h3 id="attendeeListHeading">Attendee List</h3>
          <p id="attendeeListEmpty">No attendee names recorded yet.</p>
          <ul id="attendeeList" class="attendee-list"></ul>
        </section>

        <button type="button" id="resetBtn" class="reset-btn">
          <i class="fas fa-rotate-left"></i> Reset Attendance
        </button>
      </div>
    </main>

    <footer class="footer">
      <img src="img/intel-logo.svg" alt="Intel Logo" class="footer-logo" />
      <p class="footer-copyright">&copy; 2025 Intel</p>
      <a
        href="https://www.intel.com/content/www/us/en/corporate-responsibility/2030-goals.html"
        class="footer-link"
        >Sustainability Goals</a
      >
    </footer>

    <script src="script.js"></script>
  </body>
</html>
